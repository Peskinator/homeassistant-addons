name: Sync stable SFTPGo releases

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-sftpgo-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_sftpgo_upstream.py
      - id: changes
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changes.outputs.changed == 'true'
        name: Publish and verify the image before the HA version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_app_image.py sftpgo
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "peskinator-app-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sftpgo/Dockerfile sftpgo/config.yaml sftpgo/CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(sftpgo): update to upstream v$(sed -n 's/^ARG BUILD_SFTPGO_VERSION="v\(.*\)"$/\1/p' sftpgo/Dockerfile)"
          git pull --rebase origin main
          git push origin HEAD:main
