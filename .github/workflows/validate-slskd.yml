name: Validate slskd persistence
on:
  push:
    paths:
      - "slskd/**"
      - "scripts/*slskd*"
      - "tests/test_slskd*"
      - ".github/workflows/*slskd*"
  pull_request:
    paths:
      - "slskd/**"
      - "scripts/*slskd*"
      - "tests/test_slskd*"
      - ".github/workflows/*slskd*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_slskd*.py'
      # Emulate Supervisor backup access to the non-root app's private keys.
      - run: sudo python3 scripts/test_slskd_persistence.py
      - run: sudo python3 scripts/test_slskd_vpn.py
