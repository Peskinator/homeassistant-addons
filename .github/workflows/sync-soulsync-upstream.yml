name: Sync stable SoulSync releases
on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-soulsync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_soulsync*.py'
      - name: Check stable release and versioned image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_soulsync_upstream.py
      - id: changes
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changes.outputs.changed == 'true'
        name: Validate rebuild and persistence before publishing
        # Emulate Supervisor backup access to the non-root app's private keys.
        run: sudo python3 scripts/test_soulsync_persistence.py
      - if: steps.changes.outputs.changed == 'true'
        name: Publish Home Assistant version
        run: |
          git config user.name "peskinator-app-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soulsync/Dockerfile soulsync/config.yaml soulsync/CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(soulsync): update stable upstream release"
          git pull --rebase origin main
          git push origin HEAD:main
