name: Smoke test SongMirror upstream image
on:
  push:
    branches:
      - test/songmirror-upstream-runtime
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current upstream image and build the wrapper
        run: |
          python3 scripts/sync_songmirror_upstream.py
          grep '^ARG BUILD_SONGMIRROR_IMAGE=' songmirror/Dockerfile
          docker build --platform linux/amd64 --tag songmirror-smoke ./songmirror
      - name: Start with Supervisor-style legacy data and verify health
        run: |
          data_dir=$(mktemp -d)
          trap 'docker rm -f songmirror-smoke >/dev/null 2>&1 || true; sudo rm -rf -- "$data_dir"' EXIT
          sudo chown 0:0 "$data_dir"
          sudo chmod 0755 "$data_dir"
          printf 'preserved\n' | sudo tee "$data_dir/legacy-state" >/dev/null
          printf '{}\n' | sudo tee "$data_dir/options.json" >/dev/null
          sudo chmod 0600 "$data_dir/legacy-state" "$data_dir/options.json"
          docker run --detach --name songmirror-smoke --network none \
            --cap-drop NET_RAW --cap-drop AUDIT_WRITE --cap-drop MKNOD --cap-drop SETFCAP \
            --mount "type=bind,source=$data_dir,target=/data" songmirror-smoke
          for attempt in $(seq 1 30); do
            if docker exec --user 1000:1000 songmirror-smoke /app/.venv/bin/python -c \
              'from urllib.request import urlopen; assert all(urlopen(url, timeout=2).status == 200 for url in ("http://127.0.0.1:8080/health", "http://[::1]:8080/health"))'; then
              break
            fi
            if [ "$attempt" -eq 30 ] || [ "$(docker inspect --format '{{.State.Running}}' songmirror-smoke)" != true ]; then
              docker logs songmirror-smoke
              exit 1
            fi
            sleep 2
          done
          docker exec --user 1000:1000 songmirror-smoke /app/.venv/bin/python -c '
          from pathlib import Path
          status = dict(line.split(":", 1) for line in Path("/proc/1/status").read_text().splitlines())
          assert status["Uid"].split() == ["1000"] * 4
          assert status["Gid"].split() == ["1000"] * 4
          assert Path("/data/legacy-state").read_text().strip() == "preserved"
          Path("/data/legacy-state").write_text("updated")
          Path("/data/new-state").write_text("created")
          print("SongMirror serves both IP families as UID 1000 and can open and update legacy state.")
          '
          test "$(sudo stat -c '%u:%g %a' "$data_dir/options.json")" = '0:0 600'
  dispatch:
    if: >-
      github.event.head_commit.message == 'ci(songmirror): dispatch the verified release'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Start the digest sync from the verified merge
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 84b319dd5d1d7570b3ca208f191b1247974456d2
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$main_sha" = "$EXPECTED_MAIN"
          gh workflow run sync-songmirror-upstream.yml --repo "$GITHUB_REPOSITORY" --ref main
