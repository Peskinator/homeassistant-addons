name: Sync LibraryDownloadarr container digest

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-librarydownloadarr-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync_librarydownloadarr_upstream.py
      - id: changes
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changes.outputs.changed == 'true'
        run: |
          version="$(sed -n 's/^version: "\(.*\)"$/\1/p' librarydownloadarr/config.yaml)"
          docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION="$version" --build-arg BUILD_REPOSITORY="Peskinator/homeassistant-addons" --tag "peskinator-librarydownloadarr:$version" librarydownloadarr
      - if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "peskinator-app-updater[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add librarydownloadarr/Dockerfile librarydownloadarr/config.yaml librarydownloadarr/CHANGELOG.md
          git diff --cached --check
          git commit -m "chore(librarydownloadarr): update upstream container digest"
          git push
